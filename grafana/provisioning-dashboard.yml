# Grafana dashboard provisioning. Copy this file to
# /etc/grafana/provisioning/dashboards/gbfs.yml and copy every dashboard of
# the grafana/ folder to /var/lib/grafana/dashboards/. The provider reads the
# whole folder.
apiVersion: 1

providers:
  - name: gbfs
    orgId: 1
    folder: GBFS
    type: file
    disableDeletion: false
    updateIntervalSeconds: 60
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
