# The exporter follows the multi-target pattern of blackbox_exporter. This
# file holds no target. Prometheus gives the target in the query string of
# each scrape, so a new system needs no restart of the exporter.

# Address that the exporter listens on.
listen_address: ":9718"

# Budget for one scrape. The exporter reads every feed of the system inside
# this budget. Keep the budget below the scrape_timeout of Prometheus.
timeout: 30s

# Budget for one feed. Keep it well below timeout. A module with
# max_concurrency set reads the feeds one after the other, so the feeds share
# the scrape budget.
request_timeout: 10s

# User agent that the exporter sends. Some operators ask for a contact
# address.
user_agent: "gbfs_exporter (+https://example.org/contact)"

# Hosts that the exporter accepts as a target. An empty list accepts every
# host, which lets any caller reach any address that the exporter can reach.
# Keep this list short.
allowed_hosts:
  - gbfs.urbansharing.com
  - api.entur.io
  - gbfs.lyft.com
  - gbfs.nextbike.net

# Number of scrapes that run at the same time. A scrape above the limit gets
# HTTP 503.
max_in_flight: 4

# Modules hold the settings that a query string must not carry, such as an API
# key. A scrape names one with the module parameter. A scrape without the
# parameter uses the module called default.
modules:
  # Settings for an operator that needs nothing special.
  default: {}

  # An operator that holds a reused connection. Strasbourg Citiz serves the
  # first request of a connection in 170 milliseconds and every later one in 5
  # seconds, whichever HTTP version is in use. The exporter reads the feeds of
  # one system together, so all but the first would wait. A new connection per
  # feed avoids the wait, at the cost of one handshake per feed.
  connection_hostile_operator:
    reuse_connections: false

  # An operator that is simply slow. Raise the budget for that operator alone,
  # rather than for every operator. The value must stay below timeout.
  slow_operator:
    request_timeout: 25s

  # An operator that limits parallel requests and asks for a client name.
  entur:
    # Set max_concurrency to 1 if the operator answers HTTP 429 to parallel
    # requests. A value of 0 means no limit.
    max_concurrency: 1
    # Set per_vehicle_type to true to get one series per station and per
    # vehicle type. This multiplies the number of series. Leave it off for a
    # large system.
    per_vehicle_type: true
    # Headers go with every request. Use them for an API key or for a client
    # name that the operator asks for.
    headers:
      ET-Client-Name: my-company-gbfs-exporter

  # A large system. Keep per_vehicle_type off to hold the series count down.
  large:
    per_vehicle_type: false
