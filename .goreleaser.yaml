# GoReleaser builds the binaries, the archives, and the checksums, and it
# creates the GitHub release. The container image comes from the image job of
# .github/workflows/release.yml.
version: 2

project_name: gbfs_exporter

before:
  hooks:
    - go mod download

builds:
  - id: gbfs_exporter
    main: .
    binary: gbfs_exporter
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - config.example.yml
      - src: grafana/*
        dst: grafana

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 99
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: false
  prerelease: auto
  footer: |
    ## Container image

    ```
    docker pull ghcr.io/raspbeguy/gbfs_exporter:{{ .Version }}
    ```
