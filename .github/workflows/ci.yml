name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check the format, the vet report, and go.mod
        run: make lint

      - name: Run the tests
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Report the coverage
        run: go tool cover -func=coverage.out | tail -1

      - name: Build the binary
        run: make build

      - name: Check that the binary starts
        run: ./gbfs_exporter -version

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  image:
    name: Build the container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The image is built for both architectures but it is not pushed. This
      # step protects the release workflow against a broken Dockerfile.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-config:
    name: Check the release configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate .goreleaser.yaml
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

      # A full snapshot release proves the whole path, including the archives and
      # the changelog templates, before a tag reaches the release workflow.
      - name: Build a snapshot release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,announce
